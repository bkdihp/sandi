<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Ivory / Scout Warm Amber Glow -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Siluet Tunas Kelapa: Rich Scout Dark Bronze / Umber -->
    <linearGradient id="tunasAlami" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="40%" stop-color="#78350F" />
      <stop offset="85%" stop-color="#552107" />
      <stop offset="100%" stop-color="#381303" />
    </linearGradient>

    <!-- Siluet Rumput Ilalang: Hijau Daun Segar Alami Bertingkat -->
    <linearGradient id="rumputAlami" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="35%" stop-color="#16A34A" />
      <stop offset="75%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>

    <!-- Pijakan Tanah Alami / Humus -->
    <linearGradient id="tanahAlami" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532D" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#15803D" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#552107" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#14532D" stop-opacity="0.25" />
    </linearGradient>

    <!-- Soft Ambient Badge Shadow -->
    <filter id="softGlow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#78350F" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#badgeBg)" stroke="#D97706" stroke-width="1.8" stroke-opacity="0.35" filter="url(#softGlow)" />
  <rect x="9.5" y="9.5" width="101" height="101" rx="22.5" fill="none" stroke="#B45309" stroke-width="1" stroke-dasharray="3.5 2.5" stroke-opacity="0.22" />

  <!-- ================= 1. SILUET TUNAS KELAPA (SESUAI GAMBAR REFERENSI RESMI) ================= -->
  <!-- Butir kelapa di kiri dengan ujung lancip ke kiri, tunas menjulang di kanan dengan 2 kuncup daun & akar berlabuh di titik simpul (59, 86) -->
  <g fill="url(#tunasAlami)">
    <!-- Badan Cikal Utama -->
    <path
      d="M17 66
         C16 68 19 74 25 79
         C33 86 46 87 56 86
         C58 83 60 76 62 68
         C65 58 68 48 69 38
         C70 25 66 14 64 7
         C61 12 59 19 57 27
         C56 24 54 18 52 14
         C53 18 54 23 55 29
         C57 41 57 52 57 62
         C56 56 54 52 50 49
         C42 45 31 49 24 55
         C19 60 17 64 17 66 Z"
    />

    <!-- Akar Cikal Alami Menghujam Lembut ke Tanah dari Titik Asal (59, 86) -->
    <path
      d="M57 86
         C57.8 89 58.6 92.5 59.5 94
         C60.4 92.5 61.2 89 61 86 Z"
      opacity="0.95"
    />

    <!-- Aksen Serat Daun Muda Translusen Halus -->
    <path
      d="M57 28 C56.5 38 56.5 48 57.5 58"
      stroke="#FDE68A"
      stroke-width="1"
      stroke-linecap="round"
      opacity="0.45"
    />
  </g>

  <!-- ================= 2. RUMPUT ILALANG ALAMI (MELENGKUNG & MENJUNTAI LUWES) ================= -->
  <!-- Helai rumput ilalang tidak kaku lurus: daun menjulang tinggi lalu melengkung anggun ke bawah
       mengikuti gravitasi dan tiupan angin alam, berakar dari titik simpul yang sama (59, 86) tanpa overlap -->
  <g fill="url(#rumputAlami)">
    <!-- Helai 1: Daun Ilalang Utama (Menjulang, Mencapai Puncak, lalu Menjuntai Melengkung ke Bawah) -->
    <path
      d="M59 86
         C63 68 70 42 79 24
         C84 15 91 16 96 23
         C98 27 99 35 97 42
         C94 34 91 25 85 23
         C77 24 71 47 67 67
         C65 77 64 82 63.5 86 Z"
    />

    <!-- Helai 2: Daun Ilalang Kedua (Melengkung Lembut Menjuntai di Bawah Helai Utama) -->
    <path
      d="M60.5 86
         C65 74 74 58 85 46
         C91 40 97 41 101 47
         C103 51 103 57 101 62
         C98 55 94 48 88 48
         C80 52 74 65 70 77
         C68 81 67 84 66 86 Z"
    />

    <!-- Aksen Tulang Daun Lengkung Alami (Mengikuti Lengkungan Daun Menjuntai) -->
    <path
      d="M61 82 C68 64 76 43 85 24 C89 19 93 20 96 28"
      stroke="#86EFAC"
      stroke-width="0.8"
      stroke-linecap="round"
      fill="none"
      opacity="0.4"
    />
  </g>

  <!-- ================= 3. GUNDUKAN TANAH ORGANIK ================= -->
  <!-- Kontur tanah alami tempat bertumbuhnya cikal kelapa dan rumput ilalang dari satu titik awal -->
  <path
    d="M15 88
       C34 85.5 50 85 59.5 85
       C69 85 85 85.5 105 88
       C85 91 50 91.5 15 88 Z"
    fill="url(#tanahAlami)"
  />
</svg>
